<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Peta</h1>
  </header>

  <form id="note-form">
    <input id="note-text" type="text" placeholder="メモを入力..." autocomplete="off" required>

    <div class="color-presets" id="color-presets">
      <button type="button" class="swatch" data-color="#fff59d" style="--swatch-color:#fff59d" title="イエロー"></button>
      <button type="button" class="swatch" data-color="#ffcc80" style="--swatch-color:#ffcc80" title="オレンジ"></button>
      <button type="button" class="swatch" data-color="#ef9a9a" style="--swatch-color:#ef9a9a" title="ピンク"></button>
      <button type="button" class="swatch" data-color="#a5d6a7" style="--swatch-color:#a5d6a7" title="グリーン"></button>
      <button type="button" class="swatch" data-color="#90caf9" style="--swatch-color:#90caf9" title="ブルー"></button>
      <button type="button" class="swatch" data-color="#ce93d8" style="--swatch-color:#ce93d8" title="パープル"></button>
    </div>

    <input id="note-color" type="color" value="#fff59d" title="カスタム色">
    <button type="submit">追加</button>
  </form>

  <main id="board"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
